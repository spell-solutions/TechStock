<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - TechStore PDV</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="pagina-login">
    <div class="cartao-login">
        <h2>TechStore Corporativo</h2>
        <p>Acesso ao Módulo de Vendas & Estoque</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for cat, msg in messages %}
            {% if not msg.startswith("Bem-vindo(a),") %}
            <div class="mensagem-login {{ 'mensagem-erro' if cat == 'erro' else 'mensagem-sucesso' }}">
                {{ msg }}
            </div>
            {% endif %}
          {% endfor %}
        {% endwith %}

        <form method="POST">
            <label>E-mail Corporativo</label>
            <input type="email" name="email" required placeholder="operador@techstore">
            <label>Senha</label>
            <input type="password" name="senha" required placeholder="••••••••">
            <button type="submit">Entrar no Sistema</button>
        </form>
    </div>
    <script src="{{ url_for('static', filename='form-validation.js') }}"></script>
</body>
</html>
