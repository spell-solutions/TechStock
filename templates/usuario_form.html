<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo operador - TechStock</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="formulario-pagina">
        <section class="formulario-cartao">
            <h1>Cadastrar operador</h1>
            <p>O novo usuário terá acesso ao sistema como operador.</p>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for categoria, mensagem in messages %}
                    <div class="mensagem {{ 'mensagem-sucesso' if categoria == 'sucesso' else 'mensagem-erro' }}">{{ mensagem }}</div>
                {% endfor %}
            {% endwith %}
            <form method="POST">
                <label for="nome">Nome completo</label>
                <input id="nome" name="nome" required autocomplete="name">
                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" required autocomplete="email">
                <label for="senha">Senha (mínimo 8 caracteres)</label>
                <input id="senha" name="senha" type="password" minlength="8" required autocomplete="new-password">
                <label for="senha_confirmacao">Confirme a senha</label>
                <input id="senha_confirmacao" name="senha_confirmacao" type="password" minlength="8" required autocomplete="new-password">
                <div class="botoes-formulario">
                    <button type="submit">Cadastrar operador</button>
                    <a class="botao-secundario" href="{{ url_for('inicio') }}">Cancelar</a>
                </div>
            </form>
        </section>
    </main>
    <script src="{{ url_for('static', filename='form-validation.js') }}"></script>
</body>
</html>
